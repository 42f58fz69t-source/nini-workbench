<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="妮妮的工作台">
<meta name="theme-color" content="#7cb342">
<title>妮妮的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-v2-192.png">
<link rel="icon" href="icon-v2-192.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  /* 抹茶配色 */
  --bg: #f7f6f0;
  --bg-2: #efece2;
  --card: #ffffff;
  --primary: #7cb342;          /* 抹茶绿 */
  --primary-light: #aed581;
  --primary-dark: #558b2f;
  --primary-soft: #f1f8e9;     /* 极浅抹茶 */
  --accent: #ffab91;           /* 蜡笔小新粉橙 */
  --accent-2: #ffccbc;
  --blue: #4fc3f7;             /* 哆啦A梦蓝 */
  --yellow: #fff176;           /* 哆啦A梦黄铃铛 */
  --text: #3e4a3e;
  --text-2: #7a8a7a;
  --text-3: #b0bba8;
  --border: #e8e5d8;
  --danger: #ef5350;
  --success: #66bb6a;
  --warning: #ffa726;
  --pink: #ec407a;
  --safe-area-top: env(safe-area-inset-top, 0px);
  --safe-area-bottom: env(safe-area-inset-bottom, 0px);
}

/* 暗色护眼模式（抹茶暗色） */
[data-theme="dark"] {
  --bg: #1a2417;
  --bg-2: #232f1e;
  --card: #2a3624;
  --primary: #8bc34a;
  --primary-light: #aed581;
  --primary-dark: #c5e1a5;
  --primary-soft: #2f3d28;
  --accent: #ffab91;
  --accent-2: #ffccbc;
  --blue: #4fc3f7;
  --yellow: #fff176;
  --text: #e8f0e0;
  --text-2: #aab89c;
  --text-3: #6f7d60;
  --border: #3a4a30;
  --danger: #ef9a9a;
  --success: #a5d6a7;
  --warning: #ffb74d;
  --pink: #f48fb1;
}
[data-theme="dark"] body {
  background: linear-gradient(135deg, #1c2b18, #243318, #1a2616, #222f1c);
  background-size: 400% 400%;
}
[data-theme="dark"] .sidebar { background: rgba(42,54,36,0.72); }
[data-theme="dark"] .modal, [data-theme="dark"] .input, [data-theme="dark"] .textarea { color: var(--text); }
html, body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #e9f4da, #f3f8e8, #d9edc2, #ecf6de, #e3f0cf);
  background-size: 400% 400%;
  animation: bgFloat 22s ease infinite;
}
@keyframes bgFloat {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; font-size: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: var(--text); }

/* ===== App layout: responsive split ===== */
.app-wrap { display: flex; min-height: 100vh; }
.sidebar {
  display: flex;
  width: 250px; flex-shrink: 0;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-right: 1px solid rgba(124,179,66,0.15);
  box-shadow: 4px 0 24px rgba(124,179,66,0.08);
  flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  padding: calc(var(--safe-area-top) + 16px) 12px calc(var(--safe-area-bottom) + 16px);
}
.sidebar .sb-header { padding: 0 8px 16px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.sidebar .sb-header .logo { font-size: 18px; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 8px; }
.sidebar .sb-header .logo .dora { font-size: 22px; }
.sidebar .sb-header .sub { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.sidebar-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); font-size: 14px; font-weight: 500; margin-bottom: 2px; transition: all 0.15s;
}
.sidebar-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.sidebar-item:active, .sidebar-item:hover { background: var(--primary-soft); }
.sidebar-item.active { background: var(--primary); color: white; }
.sidebar .sb-section { font-size: 11px; color: var(--text-3); padding: 12px 12px 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

.main { flex: 1; min-width: 0; }
.app { max-width: 600px; margin: 0 auto; }

/* 桌面：侧栏始终完整显示，隐藏返回按钮 */
@media (min-width: 768px) {
  .topbar .back-btn, .topbar .menu-btn { display: none; }
}

/* 手机：常驻窄侧栏，图标+文字竖排，右侧内容留边距 */
@media (max-width: 767px) {
  body { padding-bottom: calc(16px + var(--safe-area-bottom)); }
  .sidebar {
    position: fixed; top: 0; left: 0; height: 100vh; width: 64px;
    z-index: 50;
    padding: calc(var(--safe-area-top) + 12px) 4px calc(var(--safe-area-bottom) + 12px);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar .sb-header { padding: 0 0 12px; border-bottom: 1px solid rgba(124,179,66,0.12); margin-bottom: 6px; text-align: center; }
  .sidebar .sb-header .logo { font-size: 0; justify-content: center; }
  .sidebar .sb-header .logo .dora { font-size: 24px; }
  .sidebar .sb-header .sub { display: none; }
  .sidebar .sb-section { display: none; }
  .sidebar-item {
    flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 8px 2px; font-size: 10px; font-weight: 600;
    margin-bottom: 4px; border-radius: 10px;
  }
  .sidebar-item svg { width: 22px; height: 22px; }
  .sidebar-item span { display: block; text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main { margin-left: 64px; }
  /* 展开态（可选：点击汉堡后展开为宽面板） */
  body.sb-open .sidebar {
    width: 220px; padding: calc(var(--safe-area-top) + 16px) 12px calc(var(--safe-area-bottom) + 16px);
    box-shadow: 8px 0 32px rgba(0,0,0,0.18);
  }
  body.sb-open .sidebar .sb-header .logo { font-size: 18px; justify-content: flex-start; }
  body.sb-open .sidebar .sb-header .sub { display: block; }
  body.sb-open .sb-section { display: block; }
  body.sb-open .sidebar-item {
    flex-direction: row; align-items: center; justify-content: flex-start;
    gap: 10px; padding: 10px 12px; font-size: 14px;
  }
  body.sb-open .sidebar-item span { display: inline; white-space: normal; }
  body.sb-open .main { margin-left: 220px; }
  body.sb-open::after {
    content: ''; position: fixed; inset: 0; background: rgba(0,0,0,0.25); z-index: 40;
  }
}

/* ===== Cute theme additions ===== */
/* 柔和圆角阴影 - 所有卡片 */
.card, .grid-card, .home-hero, .btn, .modal, .input, .textarea, .chip {
  box-shadow: 0 2px 12px rgba(124,179,66,0.07), 0 1px 3px rgba(0,0,0,0.03);
}

/* 卡片悬停微动 */
.grid-card {
  transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.grid-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(124,179,66,0.13), 0 2px 6px rgba(0,0,0,0.04);
}
.grid-card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 18px;
  opacity: 0;
  background: linear-gradient(135deg, rgba(124,179,66,0.03), transparent);
  transition: opacity 0.3s;
  pointer-events: none;
}
.grid-card:hover::after {
  opacity: 1;
}

/* 可爱的圆角进度条 */
.progress-bar {
  border-radius: 10px;
  background: linear-gradient(90deg, var(--primary-soft), var(--bg-2));
  overflow: hidden;
}
.progress-bar .fill {
  border-radius: 10px;
  background: linear-gradient(90deg, var(--primary-light), var(--primary), var(--primary-dark));
  position: relative;
}
.progress-bar .fill::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
  animation: shimmer 2s infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}

/* 按钮添加柔和渐变 + 可爱风格 */
.btn {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  box-shadow: 0 4px 16px rgba(124,179,66,0.3), 0 1px 4px rgba(0,0,0,0.05);
  border-radius: 16px;
  transition: all 0.2s ease;
}
.btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 8px rgba(124,179,66,0.2);
}
.btn.secondary {
  background: linear-gradient(135deg, var(--bg-2), var(--bg));
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  border: 1px solid var(--border);
}
.btn.small {
  border-radius: 12px;
}

/* 选项卡可爱化 */
.chip {
  border-radius: 20px;
  transition: all 0.2s ease;
  border: 1.5px solid transparent;
}
.chip.active {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  box-shadow: 0 2px 8px rgba(124,179,66,0.2);
  border-color: var(--primary);
}
.chip:not(.active):hover {
  background: var(--primary-soft);
  border-color: rgba(124,179,66,0.2);
}

/* 复选框可爱圆角 */
.checkbox {
  border-radius: 10px;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 2px solid var(--border);
}
.checkbox.checked {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-color: var(--primary);
  transform: scale(1.05);
}

/* 底部导航可爱 */
.bottomnav {
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -2px 16px rgba(124,179,66,0.07), 0 -1px 4px rgba(0,0,0,0.03);
  background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,255,255,0.93));
}

/* Hero 区加更多装饰 */
.home-hero {
  overflow: hidden;
}
.home-hero::before {
  content: '🍃🐱💕🍃';
  position: absolute;
  bottom: 8px;
  left: 16px;
  font-size: 18px;
  opacity: 0.35;
  animation: float 3s ease-in-out infinite;
}
.home-hero::after {
  content: '🍵';
  position: absolute;
  right: 16px;
  top: 14px;
  font-size: 42px;
  opacity: 0.2;
  transform: rotate(15deg);
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(15deg); }
  50% { transform: translateY(-6px) rotate(15deg); }
}

/* 侧边栏柔化 */
.sidebar {
  background: linear-gradient(180deg, #eef5e4 0%, var(--bg) 100%);
  border-right: 1px solid rgba(124,179,66,0.12);
}

/* 侧边栏 Logo 可爱装饰 */
.sidebar .sb-header .logo .dora {
  animation: bounce 2s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* 分割线柔化 */
.sidebar .sb-header {
  border-color: rgba(124,179,66,0.15);
}

/* 侧边栏项悬停效果 */
.sidebar-item {
  transition: all 0.2s ease;
  position: relative;
  overflow: hidden;
}
.sidebar-item::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--primary-soft), transparent);
  opacity: 0;
  transition: opacity 0.2s;
  border-radius: 12px;
}
.sidebar-item:hover::before {
  opacity: 1;
}
.sidebar-item.active {
  box-shadow: 0 4px 12px rgba(124,179,66,0.25);
}

/* 统计卡片柔化 */
.stat-box {
  background: linear-gradient(135deg, var(--primary-soft), rgba(124,179,66,0.03));
  border: 1px solid rgba(124,179,66,0.08);
  border-radius: 16px;
  transition: transform 0.2s ease;
}
.stat-box:hover {
  transform: translateY(-1px);
}
.stat-box .num {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* 标题小装饰 */
.card-title {
  letter-spacing: 0.3px;
}

/* 输入框聚焦柔和 */
.input, .textarea, .select {
  border-radius: 14px;
  transition: all 0.25s ease;
}
.input:focus, .textarea:focus, .select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(124,179,66,0.08);
  transform: translateY(-1px);
}

/* 模态框柔化 */
.modal {
  border-radius: 28px 28px 0 0;
}
.modal-handle {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--primary-light), var(--primary));
  opacity: 0.3;
}

/* 安装横幅 */
.install-banner {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 20px;
  box-shadow: 0 6px 24px rgba(124,179,66,0.2);
}

/* ===== 可爱小装饰 ===== */
/* Topbar 抹茶装饰点 */
.topbar h1::after {
  content: ' 🍵';
  font-size: 16px;
}

/* 导航项激活时的可爱动效 */
.nav-item {
  transition: all 0.2s ease;
}
.nav-item.active {
  transform: translateY(-2px);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  width: 24px;
  height: 3px;
  background: var(--primary);
  border-radius: 0 0 4px 4px;
}

/* 空状态小可爱 */
.empty .emoji {
  animation: float 3s ease-in-out infinite;
}

/* 分段控制器可爱化 */
.segmented {
  border-radius: 14px;
  padding: 4px;
  background: var(--bg-2);
}
.segmented button {
  border-radius: 11px;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.segmented button.active {
  box-shadow: 0 2px 8px rgba(124,179,66,0.12);
  font-weight: 700;
}

/* Toast 可爱化 */
.toast {
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(62,74,62,0.92), rgba(85,139,47,0.92));
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(247,246,240,0.92);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  padding: calc(var(--safe-area-top) + 12px) 16px 12px;
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.topbar h1 { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; color: var(--primary-dark); }
.topbar .actions { display: flex; gap: 4px; }
.topbar .icon-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-dark); }
.topbar .icon-btn:active { background: var(--primary-soft); }
.topbar .icon-btn svg { width: 22px; height: 22px; }
.topbar .back-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-dark); }
.topbar .back-btn:active { background: var(--primary-soft); }
.topbar .back-btn svg { width: 22px; height: 22px; }
.topbar .menu-btn { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-dark); }
.topbar .menu-btn:active { background: var(--primary-soft); }
.topbar .menu-btn svg { width: 22px; height: 22px; }

/* ===== Pages ===== */
.page { display: none; padding: 16px; }
.page.active { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ===== Mobile bottom nav ===== */
.bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: rgba(255,255,255,0.95);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--border);
  padding-bottom: var(--safe-area-bottom);
  display: flex; justify-content: space-around;
}
@media (min-width: 768px) { .bottomnav { display: none; } }
.nav-item {
  flex: 1; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--text-3); font-size: 10px; transition: color 0.15s;
}
.nav-item svg { width: 24px; height: 24px; }
.nav-item.active { color: var(--primary); }

/* ===== Home hero ===== */
.home-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border-radius: 24px; padding: 24px 20px; margin-bottom: 16px;
  box-shadow: 0 6px 24px rgba(124,179,66,0.3);
  position: relative; overflow: hidden;
}
.home-hero::after {
  content: '🍃'; position: absolute; right: 16px; top: 12px; font-size: 40px; opacity: 0.25; transform: rotate(15deg);
}
.home-hero .date { font-size: 13px; opacity: 0.85; }
.home-hero .greeting { font-size: 24px; font-weight: 800; margin-top: 4px; letter-spacing: -0.5px; }
.home-hero .summary { font-size: 13px; opacity: 0.92; margin-top: 10px; line-height: 1.7; }
.home-hero .dora-line { font-size: 12px; opacity: 0.8; margin-top: 8px; }

/* ===== Grid ===== */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-card {
  background: var(--card); border-radius: 18px; padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
  box-shadow: 0 2px 6px rgba(85,139,47,0.06);
  transition: transform 0.1s; position: relative;
}
.grid-card:active { transform: scale(0.97); }
.grid-card .icon-wrap {
  width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  color: white;
}
.grid-card .icon-wrap svg { width: 24px; height: 24px; }
.grid-card .title { font-size: 14px; font-weight: 700; color: var(--text); }
.grid-card .desc { font-size: 11px; color: var(--text-2); line-height: 1.4; }
.grid-card .badge-new { position: absolute; top: 8px; right: 8px; background: var(--accent); color: white; font-size: 9px; padding: 2px 6px; border-radius: 8px; font-weight: 700; }

/* ===== Cards ===== */
.card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(85,139,47,0.05); }
.card-title { font-size: 13px; font-weight: 700; color: var(--text-2); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.card-title a { color: var(--primary-dark); font-size: 12px; font-weight: 600; }

/* ===== Buttons ===== */
.btn { background: var(--primary); color: white; padding: 12px 16px; border-radius: 14px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; box-shadow: 0 3px 10px rgba(124,179,66,0.25); }
.btn:active { transform: scale(0.98); }
.btn.secondary { background: var(--bg-2); color: var(--text); box-shadow: none; }
.btn.danger { background: var(--danger); box-shadow: 0 3px 10px rgba(239,83,80,0.25); }
.btn.small { width: auto; padding: 6px 12px; font-size: 12px; }
.btn.ghost { background: transparent; color: var(--primary-dark); box-shadow: none; }

/* ===== Inputs ===== */
.input, .textarea, .select {
  width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--card); margin-bottom: 8px; outline: none; transition: border 0.15s;
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--primary); }
.textarea { resize: none; min-height: 70px; }
.label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; margin-top: 8px; display: block; font-weight: 600; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }

/* ===== Checkbox list ===== */
.task-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.task-item:last-child { border-bottom: none; }
.checkbox {
  width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s;
}
.checkbox.checked { background: var(--primary); border-color: var(--primary); }
.checkbox svg { width: 16px; height: 16px; color: white; opacity: 0; transition: opacity 0.1s; }
.checkbox.checked svg { opacity: 1; }
.task-text { flex: 1; font-size: 15px; }
.task-item.done .task-text { color: var(--text-3); text-decoration: line-through; }
.task-delete { color: var(--text-3); padding: 4px; opacity: 0.3; transition: opacity 0.15s; }
.task-item:active .task-delete { opacity: 1; }
.task-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ===== Chips ===== */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip { padding: 7px 14px; border-radius: 20px; background: var(--bg-2); font-size: 12px; font-weight: 600; color: var(--text-2); transition: all 0.15s; }
.chip.active { background: var(--primary); color: white; }

/* ===== Progress ===== */
.progress-bar { height: 7px; background: var(--bg-2); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light)); border-radius: 4px; transition: width 0.3s; }

/* ===== Calendar ===== */
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.calendar-header .month { font-size: 16px; font-weight: 700; color: var(--primary-dark); }
.calendar-header button { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary-dark); }
.calendar-header button:active { background: var(--primary-soft); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.calendar-weekday { text-align: center; font-size: 11px; color: var(--text-3); padding: 4px 0; font-weight: 600; }
.calendar-day {
  aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 13px; border-radius: 10px; position: relative; gap: 2px; transition: background 0.1s;
}
.calendar-day:active { background: var(--primary-soft); }
.calendar-day.other { color: var(--text-3); opacity: 0.4; }
.calendar-day.today { font-weight: 800; }
.calendar-day.today::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--primary); }
.calendar-day.period { background: var(--pink); color: white; font-weight: 600; }
.calendar-day.predicted { background: rgba(236,64,122,0.2); color: var(--pink); }
.calendar-day.ovulation { background: var(--warning); color: white; font-weight: 600; }

/* ===== Stat ===== */
.stat-row { display: flex; gap: 10px; }
.stat-box { flex: 1; background: var(--primary-soft); border-radius: 14px; padding: 12px; text-align: center; }
.stat-box .num { font-size: 22px; font-weight: 800; color: var(--primary-dark); }
.stat-box .lbl { font-size: 11px; color: var(--text-2); margin-top: 2px; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(62,74,62,0.4); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; animation: fadeIn 0.15s; }
.modal {
  background: var(--card); width: 100%; max-width: 600px;
  border-radius: 24px 24px 0 0; padding: 20px 16px calc(20px + var(--safe-area-bottom));
  max-height: 90vh; overflow-y: auto; animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-handle { width: 36px; height: 5px; background: var(--text-3); border-radius: 3px; margin: 0 auto 16px; opacity: 0.4; }
.modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 16px; color: var(--primary-dark); }

/* ===== Segmented ===== */
.segmented { display: flex; background: var(--bg-2); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
.segmented button { flex: 1; padding: 9px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-2); transition: all 0.15s; }
.segmented button.active { background: var(--card); color: var(--primary-dark); box-shadow: 0 1px 4px rgba(85,139,47,0.1); }

/* ===== Empty state ===== */
.empty { text-align: center; padding: 40px 20px; color: var(--text-3); }
.empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty .emoji { font-size: 40px; margin-bottom: 8px; opacity: 0.6; }

/* ===== List ===== */
.list-item { padding: 14px 0; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 12px; }
.list-item:last-child { border-bottom: none; }
.list-item .main { flex: 1; min-width: 0; }
.list-item .title { font-size: 15px; font-weight: 600; }
.list-item .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.list-item .right { text-align: right; }
.badge { display: inline-block; padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge.pink { background: rgba(236,64,122,0.15); color: var(--pink); }
.badge.green { background: rgba(102,187,106,0.18); color: var(--success); }
.badge.orange { background: rgba(255,167,38,0.18); color: var(--warning); }
.badge.blue { background: rgba(79,195,247,0.18); color: var(--blue); }
.badge.gray { background: var(--bg-2); color: var(--text-2); }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: calc(90px + var(--safe-area-bottom)); left: 50%; transform: translateX(-50%);
  background: rgba(62,74,62,0.9); color: white; padding: 10px 20px; border-radius: 20px;
  font-size: 13px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap;
}
@media (min-width: 768px) { .toast { bottom: 24px; } }
.toast.show { opacity: 1; }

/* ===== Cycle phase card ===== */
.phase-card { border-radius: 18px; padding: 16px; color: white; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
.phase-card .phase-name { font-size: 18px; font-weight: 800; }
.phase-card .phase-desc { font-size: 13px; opacity: 0.95; margin-top: 4px; }
.phase-card .tips { margin-top: 12px; font-size: 12px; line-height: 1.8; }

/* ===== Habit ===== */
.habit-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 0.5px solid var(--border); }
.habit-row:last-child { border-bottom: none; }

.install-banner {

.essay-box { background: var(--primary-soft); border-radius: 14px; padding: 16px; margin-top: 8px; }

.essay-box .topic { font-size: 15px; font-weight: 700; margin-top: 4px; line-height: 1.6; }
.essay-box .content-label { font-size: 10px; color: var(--primary-dark); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 12px; }
.essay-box .content { font-size: 13px; line-height: 1.9; margin-top: 6px; }
.essay-box .content p { margin-bottom: 6px; }
.refresh-btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--primary-dark); font-weight: 600; padding: 6px 12px; border-radius: 8px; background: var(--primary-soft); }

.sparkle:nth-child(2) { bottom: 140px; right: 50px; animation-delay: 0.6s; }

.pet-wrap {

}

}
.pet-wrap.sleeping { filter: drop-shadow(0 2px 8px rgba(100,160,200,0.15)) brightness(0.85); }

/* —— 嵌套分层动画：每层只管一个 transform 属性，互不覆盖 —— */
.pet-anim {
  display: inline-block;

  animation: petIdle 3.4s ease-in-out infinite;

  display: block; width: 72px; height: auto;

/**
 * 根据日期生成每日内容（纯客户端，不依赖后端）
 */
function generateBuiltinDaily(dateStr) {
  const seed = dateStr.split('-').reduce((a, b) => a * 1000 + parseInt(b), 0);

  const pool = POLITICS_DATA.slice();
  const politics = [];
  let idx = seed;
  while (politics.length < 5 && pool.length > 0) {
    idx = (idx * 9301 + 49297) % 233280;
    const pickIdx = idx % pool.length;
    const item = pool.splice(pickIdx, 1)[0];
    let category = '国内';
    const catKw = {
      '经济': ['经济','GDP','增长','产业','金融','贸易','消费','投资','企业','市场','财政','货币','就业','进出口','海关','工业'],
      '科技': ['科技','航天','卫星','火箭','人工智能','5G','芯片','新能源','技术','创新','数字','互联网','量子','算力','低空'],
      '民生': ['民生','教育','医疗','养老','住房','就业','社保','医保','学校','收入','卫生','台风','防汛','健身'],
      '法治': ['法律','法规','司法','法院','检察院','公安','依法','违法','犯罪','法治','国防','军事','知识产权'],
      '生态': ['生态','环保','碳','绿色','环境','气候','污染','排放','美丽中国'],
      '外交': ['外交','国际','一带一路','人类命运共同体','全球','世界','丝路','金砖','中欧','中法','上合','东盟','王毅','纳米比亚'],
    };
    for (const [cat, kws] of Object.entries(catKw)) {
      if (kws.some(kw => item.body.includes(kw))) { category = cat; break; }
    }
    politics.push({ category, body: item.date + '，' + item.body, quiz: null });
  }

  const essayIdx = seed % ESSAY_DATA.length;

  return {
    date: dateStr,
    politics,
    essay: ESSAY_DATA[essayIdx],
    generated_at: new Date().toISOString(),
  };
}

      { q: '当事人既约定违约金又约定定金的，一方违约时对方？', opts: ['可同时适用','只能择一适用','只能适用违约金','只能适用定金'], answer: 1, tip: '定金与违约金不能并用，一方违约时对方可选择适用违约金或定金条款。' },
      { q: '租赁期限不得超过？', opts: ['10年','15年','20年','30年'], answer: 2, tip: '租赁期限不超20年，超过部分无效；期满可续订，续订也不超20年。' },
      { q: '"买卖不破租赁"是指？', opts: ['租赁物所有权变动不影响租赁合同效力','买卖合同无效','租赁自动解除','新所有权人可驱赶承租人'], answer: 0, tip: '租赁物在承租人依租赁合同占有期限内发生所有权变动的，不影响租赁合同效力，即"买卖不破租赁"。' },
      { q: '债权人转让债权未通知债务人的，该转让对债务人？', opts: ['有效','不发生效力','可撤销','效力待定'], answer: 1, tip: '债权转让未通知债务人的，对债务人不发生效力；通知非经受让人同意不得撤销。' },
      { q: '下列属于法定解除合同情形的是？', opts: ['双方协商一致','因不可抗力致使不能实现合同目的','一方想换合作方','市场价格上涨'], answer: 1, tip: '法定解除包括：不可抗力致不能实现目的；预期违约；迟延履行经催告合理期限仍未履行；根本违约等。' }
    ],
    law: [
      '《民法典》第469条：合同可采用书面、口头或其他形式；书面形式包括合同书、信件、电报、电传、传真等可有形表现内容的形式。',
      '《民法典》第495条：当事人约定将来一定期限内订立合同，认购书、订购书、预订书等构成预约合同。',
      '《民法典》第509条：当事人应按约定全面履行义务，遵循诚信原则履行通知、协助、保密等义务（协作履行）。',
      '《民法典》第533条：情势变更——合同成立后客观情况发生订立时无法预见的重大变化，可请求法院或仲裁机构变更或解除。',
      '《民法典》第563条：法定解除情形——不可抗力致不能实现目的、预期违约、迟延履行经催告仍未履行、根本违约等。',
      '《民法典》第584条：违约损害赔偿含合同履行后可获利益，但不得超违约方订立合同时预见到或应预见的损失。',
      '《民法典》第586—588条：定金不超主合同标的额20%，定金与违约金不能并用，可择一适用。',
      '《民法典》第725条：租赁物在承租人占有期限内发生所有权变动的，不影响租赁合同效力（买卖不破租赁）。'
    ]
  },
  '犯罪学': {
    mcq: [
      { q: '犯罪学的研究对象主要包括？', opts: ['犯罪现象、犯罪原因、犯罪预防','仅研究犯罪人心理','仅研究刑法条文','仅研究侦查技术'], answer: 0, tip: '犯罪学以犯罪现象、犯罪原因、犯罪预防为三大研究对象，侧重事实描述、成因解释与防控对策，不同于刑法学的规范研究。' },
      { q: '被称为"犯罪学之父"、提出"天生犯罪人"理论的是？', opts: ['迪尔凯姆','龙勃罗梭','弗洛伊德','贝卡里亚'], answer: 1, tip: '意大利学者龙勃罗梭（Lombroso）通过人体测量提出"天生犯罪人"说，被视为实证犯罪学奠基人之一。' },
      { q: '迪尔凯姆（涂尔干）主要从何种角度解释犯罪？', opts: ['生物学角度','社会失范（anomie）角度','心理学角度','地理角度'], answer: 1, tip: '迪尔凯姆提出"社会失范"，认为社会规范缺失或冲突使个体行为失去约束，是越轨与犯罪的社会根源之一。' },
      { q: '默顿（Merton）"紧张理论"认为犯罪源于？', opts: ['生物遗传缺陷','文化目标与合法手段之间的张力','气候因素','家庭贫穷'], answer: 1, tip: '紧张理论认为社会既强调成功目标又限制合法手段，目标—手段脱节产生紧张，部分人选择越轨（含犯罪）手段。' },
      { q: '萨瑟兰（Sutherland）"差别交往理论"强调？', opts: ['犯罪是遗传的','犯罪是通过与违法者交往学习而来','犯罪源于气候','犯罪是经济必然'], answer: 1, tip: '差别交往理论主张犯罪行为是习得的，个体通过与持违法态度的群体交往，学习违法的定义、技巧与动机。' },
      { q: '芝加哥学派用"同心圆"模式解释城市犯罪，其代表理论是？', opts: ['社会解体理论','天生犯罪人理论','紧张理论','标签理论'], answer: 0, tip: '芝加哥学派用同心圆 zones 解释犯罪分布，认为城市中心过渡区社会解体（控制弱）致犯罪率高。' },
      { q: '标签理论的代表人物有？', opts: ['龙勃罗梭','贝克、莱默特','默顿','萨瑟兰'], answer: 1, tip: '标签理论关注"越轨"如何被社会定义为犯罪，莱默特提出初级/次级越轨，贝克尔强调"贴标签"塑造持续越轨生涯。' },
      { q: '犯罪统计中的"暗数"（黑数）是指？', opts: ['已破案案件数','实际发生但未被发现或未被记录于官方统计的犯罪','监狱在押人数','累犯数量'], answer: 1, tip: '犯罪暗数是实际发生但因未被发现、未报案、未立案而未计入官方统计的犯罪，故官方犯罪率常低于真实水平。' },
      { q: '能揭示犯罪暗数、与官方统计互补的调查方法是？', opts: ['被害人调查（受害调查）','人口普查','经济普查','舆情调查'], answer: 0, tip: '被害人调查通过询问公众是否受害估算犯罪总量，能揭示官方统计之外的犯罪暗数。' },
      { q: '"白领犯罪"（white-collar crime）概念由谁提出？', opts: ['萨瑟兰','贝卡里亚','边沁','龙勃罗梭'], answer: 0, tip: '萨瑟兰提出"白领犯罪"，指受人尊敬、有较高社会地位者在职业活动中实施的犯罪，强调犯罪非下层专属。' },
      { q: '被害人学的奠基人通常被认为是？', opts: ['冯·亨蒂希、门德尔松','龙勃罗梭','贝卡里亚','迪尔凯姆'], answer: 0, tip: '被害人学研究犯罪中的被害人角色，冯·亨蒂希与门德尔松被视为奠基人，提出被害人与加害人的互动关系。' },
      { q: '犯罪预防中的"情境预防"强调？', opts: ['改造社会结构根治犯罪','通过环境设计减少犯罪机会（监控、门禁）','仅靠刑罚威慑','移民管控'], answer: 1, tip: '情境预防通过管理、设计、环境改造增加犯罪难度与风险、减少收益，降低特定场所犯罪机会。' },
      { q: '犯罪预防"三级预防"中，针对已犯罪者防止再犯属于？', opts: ['一级预防','二级预防','三级预防','初级预防'], answer: 2, tip: '一级面向全体一般预防，二级针对高危人群早期干预，三级针对已犯罪者防止再犯（矫治与回归）。' },
      { q: '青少年犯罪研究中"同伴影响"最贴合哪类理论？', opts: ['差别交往理论','天生犯罪人理论','气候决定论','生物遗传论'], answer: 0, tip: '差别交往理论强调与违法同伴的交往学习是青少年犯罪的重要机制，同伴影响是核心变量。' },
      { q: '关于犯罪率，正确的是？', opts: ['犯罪率=某时期犯罪数/同期人口数','犯罪率与人口无关','犯罪率只统计重罪','犯罪率恒定不变'], answer: 0, tip: '犯罪率通常以一定时期犯罪案件数或犯罪人数除以同期平均人口数计算，用于地区与时间比较。' },
      { q: '有组织犯罪的特征不包括？', opts: ['结构相对稳定','以违法犯罪活动获取经济利益','完全随机无组织','有保护伞或渗透合法经济'], answer: 2, tip: '有组织犯罪具稳定组织结构、以非法手段牟利、常渗透合法经济并可能寻求"保护伞"，并非随机无组织。' },
      { q: '网络犯罪（cybercrime）的突出特点是？', opts: ['地域局限性强','匿名性、跨地域、高技术性','只危害个人财产','无需技术手段'], answer: 1, tip: '网络犯罪具匿名、跨地域、技术依赖、危害扩散快等特点，给侦查管辖与取证带来新挑战。' },
      { q: '我国犯罪学研究的早期开拓者是？', opts: ['严景耀','贝卡里亚','龙勃罗梭','迪尔凯姆'], answer: 0, tip: '严景耀是我国犯罪学早期开拓者，曾实地调查监狱、撰写中国犯罪学研究，推动本土犯罪学发展。' }
    ],
    law: [
      '犯罪学三客体：犯罪现象（what）、犯罪原因（why）、犯罪预防（how），区别于刑法学对犯罪构成的规范研究。',
      '龙勃罗梭"天生犯罪人"说：从人类学测量罪犯体质特征，标志实证犯罪学开端，后世批评其生物决定论片面。',
      '迪尔凯姆"社会失范论"：规范缺位或冲突导致行为失范，犯罪是任何社会的正常（必然）现象之一。',
      '默顿紧张理论：文化强调成功目标却限制合法手段，张力催生越轨（创新、仪式主义、退却、反叛等适应方式）。',
      '萨瑟兰差别交往理论：犯罪是向亲密群体习得的——学习违法的定义、动机、技巧与态度。',
      '标签理论：初级越轨→被贴标签→次级越轨（越轨生涯），强调社会反应对犯罪的建构作用。',
      '被害人学：冯·亨蒂希、门德尔松奠基，研究被害人易感性、与加害人互动及被害预防。',
      '情境预防：通过环境设计（CPTED）、目标加固、访问控制、监控等减少犯罪机会，而非仅靠惩罚。'
    ]
  },
  '侵权责任法': {
    mcq: [
      { q: '我国侵权责任归责原则体系以什么为原则？', opts: ['无过错责任为原则','过错责任为原则，辅以过错推定与无过错责任','公平责任为原则','结果责任为原则'], answer: 1, tip: '侵权责任以过错责任为原则（民法典1165条），法律规定适用过错推定、无过错责任的为例外（1166条）。' },
      { q: '下列适用无过错责任（严格责任）的是？', opts: ['一般故意伤害','产品缺陷致人损害','普通交通事故轻微擦碰（无特殊情形）','邻居争吵'], answer: 1, tip: '无过错责任适用于：产品责任、机动车交通事故（特定情形）、环境污染生态破坏、高度危险、饲养动物、监护人、用人单位/用工等。' },
      { q: '无民事行为能力人在幼儿园、学校受人身损害，幼儿园不能证明尽到管理职责的，适用？', opts: ['过错责任','过错推定责任','无过错责任','公平责任'], answer: 1, tip: '无民事行为能力人在教育机构受损害，教育机构适用过错推定（不能证明尽职责的推定有过错）；限制民事行为能力人则适用一般过错责任。' },
      { q: '高度危险责任一般适用？', opts: ['过错责任','无过错责任','公平责任','过错推定'], answer: 1, tip: '从事高度危险作业、占有或使用高度危险物致人损害适用无过错责任，行为人即使无过错也须赔偿（法定免责事由除外）。' },
      { q: '饲养动物造成他人损害的，动物饲养人或管理人一般承担？', opts: ['过错责任','无过错责任','公平责任','过错推定'], answer: 1, tip: '饲养动物损害一般无过错责任；违反管理规定未采取措施致害的无受害人故意免责；禁止饲养烈性犬等危险动物致害绝对严格。' },
      { q: '被侵权人对同一损害发生也有过错的，侵权人可以？', opts: ['完全不赔','主张减轻责任（与有过失/过失相抵）','要求对方全责','拒绝任何赔偿'], answer: 1, tip: '被侵权人对损害发生有过错的，可以减轻侵权人责任（过失相抵/与有过失）。' },
      { q: '损害完全因受害人故意造成的，行为人不承担责任，这体现了？', opts: ['过错责任','受害人故意免责事由','公平责任','连带责任'], answer: 1, tip: '受害人故意是法定免责/减责事由；损害完全因受害人故意造成的，行为人不承担责任。' },
      { q: '二人以上共同实施侵权行为造成他人损害的，应当承担？', opts: ['按份责任','连带责任','补充责任','不承担责任'], answer: 1, tip: '共同侵权（共同故意或共同过失）致人损害，行为人承担连带责任；被侵权人可请求部分或全部连带责任人承担。' },
      { q: '教唆、帮助他人实施侵权的，教唆帮助者应当？', opts: ['不承担责任','与行为人承担连带责任（教唆帮助完全民事行为能力人）','仅承担道德责任','承担补充责任'], answer: 1, tip: '教唆帮助他人侵权的与行为人承担连带责任；教唆帮助无/限制民事行为能力人，由教唆帮助人承担责任（监护人未尽职责承担相应责任）。' },
      { q: '网络用户利用网络服务侵权，权利人通知后网络服务提供者未及时采取必要措施的，对扩大部分与用户承担？', opts: ['按份责任','连带责任','不承担责任','补充责任'], answer: 1, tip: '网络侵权"通知—删除"规则：网络服务提供者接到通知未及时采取必要措施，对损害扩大部分与网络用户承担连带责任。' },
      { q: '因产品缺陷造成他人损害的，被侵权人可以向谁请求赔偿？', opts: ['只能向销售者','只能向生产者','可以向生产者或销售者','只能向运输者'], answer: 2, tip: '产品责任中被侵权人可向生产者或销售者请求赔偿；二者间追偿按过错（生产者原则无过错、销售者过错等）。' },
      { q: '环境污染、生态破坏纠纷中，因果关系的举证责任一般由谁承担？', opts: ['由受害人承担全部','由行为人就无因果关系举证（举证责任倒置）','由法院推定无因果','无需举证'], answer: 1, tip: '环境污染侵权采因果关系举证责任倒置，由行为人就其行为与损害之间不存在因果关系举证（仍属无过错责任）。' },
      { q: '侵害他人人身权益造成他人严重精神损害的，被侵权人有权请求？', opts: ['精神损害赔偿','双倍财产赔偿','仅惩罚性赔偿','无需赔偿'], answer: 0, tip: '侵害自然人人身权益造成严重精神损害的，可请求精神损害赔偿；故意或重大过失侵害具有人身意义的特定物亦可请求。' },
      { q: '双方对损害发生均无过错时，公平责任适用于？', opts: ['所有损害一律适用','依照法律的规定由双方分担损失','侵权人全赔','受害人全担'], answer: 1, tip: '公平责任是例外，仅在"依照法律的规定"且双方均无过错时由双方分担损失（民法典1186已限缩为"依照法律的规定"）。' },
      { q: '用人单位工作人员因执行工作任务造成他人损害的，由谁担责？', opts: ['工作人员个人','用人单位','双方各半','不承担责任'], answer: 1, tip: '用人单位工作人员因执行工作任务致他人损害的，由用人单位担责；用人单位担责后可向有故意或重大过失的工作人员追偿。' },
      { q: '正当防卫造成损害的，防卫人？', opts: ['一律全赔','未超过必要限度不承担责任','承担全部责任','承担惩罚性赔偿'], answer: 1, tip: '正当防卫（未超必要限度）造成损害的防卫人不承担责任；超过必要限度造成不应有损害的承担适当责任。紧急避险亦为免责/减责事由。' },
      { q: '二人以上分别实施侵权行为造成同一损害，每一行为均足以造成全部损害的，行为人承担？', opts: ['按份责任','连带责任','不承担责任','补充责任'], answer: 1, tip: '民法典1171条：分别侵权每一行为均足以造成全部损害的，连带责任（累积因果关系）；1172条则按份。' },
      { q: '因第三人的过错污染环境造成损害的，被侵权人可以向谁请求赔偿？', opts: ['只能向第三人','可以向侵权人请求赔偿（侵权人赔偿后可向第三人追偿）','只能向环保部门','无权请求'], answer: 1, tip: '因第三人过错污染环境损害的，被侵权人可向侵权人请求赔偿，侵权人赔偿后有权向第三人追偿。' }

// 按日期确定性轮换：同一天打开内容一致，跨天自动更新
function studyDayIndex(dateStr) {
  const d = new Date((dateStr || todayStr()) + 'T00:00:00');
  const start = new Date(d.getFullYear() + '-01-01T00:00:00');
  return Math.floor((d - start) / 86400000) + 1; // 年内第几天
}

function studyDailyContent(dateStr, offset) {
  offset = offset || 0;
  const di = studyDayIndex(dateStr) + offset;
  const subject = STUDY_ACTIVE[di % STUDY_ACTIVE.length];
  const bank = STUDY_BANK[subject] || { mcq: [], law: [] };
  const q = bank.mcq.length ? bank.mcq[di % bank.mcq.length] : null;
  const quickArr = STUDY_QUICK[subject] || [];
  const quick = quickArr.length ? quickArr[(di + 7) % quickArr.length] : '';
  const law = (bank.law && bank.law.length) ? bank.law[di % bank.law.length] : '';
  return { subject, question: q, quick, law };
}

// 闪卡素材：本期 3 科的选择题（正面问题/背面答案解析）+ 速记（正面考点/背面提示）
function studyFlashcards() {
  const cards = [];
  STUDY_ACTIVE.forEach(sub => {
    const bank = STUDY_BANK[sub] || { mcq: [] };
    (bank.mcq || []).forEach(m => cards.push({ subject: sub, front: m.q, back: '正确答案：' + String.fromCharCode(65 + m.answer) + '\n' + m.tip }));
    (STUDY_QUICK[sub] || []).forEach(k => cards.push({ subject: sub, front: k, back: '【' + sub + '】考点速记' }));
  });
  return cards;
}

  const w = '日一二三四五六'[dt.getDay()];
  return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日 周${w}`;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const isWide = () => window.innerWidth >= 768;

/* ---------- Storage ---------- */
const DB = {
  get(key, def) {
    try { const v = localStorage.getItem('nn_' + key); return v ? JSON.parse(v) : def; }
    catch { return def; }
  },
  set(key, val) { localStorage.setItem('nn_' + key, JSON.stringify(val)); },
  remove(key) { localStorage.removeItem('nn_' + key); },
  all() {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('nn_')) { try { out[k.slice(3)] = JSON.parse(localStorage.getItem(k)); } catch {} }
    }
    return out;
  }
};

/* ---------- Toast ---------- */
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 1800);
}

const Nav = {
  current: 'home',
  go(page) {
    Nav.current = page;
    if (Donelist.viewDate && page !== 'donelist') Donelist.viewDate = null;
    window.scrollTo(0, 0);
    Nav.refresh();
  },
  refresh() {
    Nav.renderSidebar();
    Nav.renderMain();
  },
  renderSidebar() {
    const mods = getModules();
    const groups = {};
    mods.forEach(m => { (groups[m.group] = groups[m.group] || []).push(m); });
    const groupOrder = ['main', 'daily', 'study', 'health', 'work', 'life', 'custom'];
    let html = `<div class="sb-header">
      <div class="logo"><span class="dora">🍃</span><span class="logo-text">妮妮的工作台</span></div>
      <div class="sub">All in One · 抹茶版</div>
    </div>`;
    groupOrder.forEach(g => {
      if (!groups[g]) return;
      html += `<div class="sb-section">${GROUP_LABELS[g] || g}</div>`;
      groups[g].forEach(m => {
        html += `<div class="sidebar-item ${Nav.current === m.id ? 'active' : ''}" onclick="Nav.go('${m.id}');Nav.closeSidebarMobile()">${m.icon}<span>${esc(m.title)}${m.badge ? ' <span style="font-size:9px;color:var(--accent)">●</span>' : ''}</span></div>`;
      });
    });
    html += `<div class="sb-section">系统</div>`;
    html += `<div class="sidebar-item ${Nav.current === 'settings' ? 'active' : ''}" onclick="Nav.go('settings');Nav.closeSidebarMobile()">${ICONS.settings}<span>设置</span></div>`;
    $('#sidebar').innerHTML = html;
  },
  renderMain() {
    const def = getModuleDef(Nav.current);
    const title = def ? def.title : (PAGES[Nav.current] ? (Nav.current === 'settings' ? '设置' : '') : '');
    const render = PAGES[Nav.current] || PAGES.home;
    const isHome = Nav.current === 'home';

    let topbar;
    if (isHome) {
      topbar = `<div class="topbar">
        <button class="menu-btn" onclick="Nav.toggleSidebar()" aria-label="菜单">${ICONS.menu || '☰'}</button>
        <h1>妮妮的工作台 🍃</h1>
        <div class="actions">
          <button class="icon-btn" onclick="Search.open()" title="搜索">🔍</button>
          <button class="icon-btn" onclick="Nav.go('settings')">${ICONS.settings}</button>
        </div>
      </div>`;
    } else {
      topbar = `<div class="topbar">
        <button class="menu-btn" onclick="Nav.toggleSidebar()" aria-label="菜单">${ICONS.menu || '☰'}</button>
        <button class="back-btn" onclick="Nav.go('home')">${ICONS.chevL}</button>
        <h1>${esc(title)}</h1>
        <div style="width:34px"></div>
      </div>`;
    }
    $('#app').innerHTML = topbar + `<div class="page active">${render()}</div>`;
  },
  toggleSidebar() {
    document.body.classList.toggle('sb-open');
  },
  closeSidebarMobile() {
    document.body.classList.remove('sb-open');
  },
  renderBottomNav() {
    return '';
  }
};

      </div>
      <div class="card">
        <div class="card-title"><span>✅ 每日待办 · ${done}/${todos.length}</span><a onclick="Donelist.add('daily')">+ 添加</a></div>
        ${todoHtml}
      </div>
      <div class="card">
        <div class="card-title"><span>📋 不急但要完成 · ${later.length}</span><a onclick="Donelist.add('later')">+ 添加</a></div>
        ${laterHtml}
        ${laterDone.length ? `<details style="margin-top:8px"><summary style="font-size:12px;color:var(--text-3);cursor:pointer">已完成 ${laterDone.length} 项</summary>${laterDone.map(i => `<div class="task-item done"><div class="checkbox checked">${ICONS.check}</div><div style="flex:1"><div class="task-text">${esc(i.text)}</div></div><button class="task-delete" onclick="Backlog.del('${i.id}')">${ICONS.trash}</button></div>`).join('')}</details>` : ''}
      </div>
      <div class="card">
        <div class="card-title"><span>📚 所有事项 · ${all.length}</span></div>
        <div style="max-height:420px;overflow-y:auto;-webkit-overflow-scrolling:touch">${allHtml}</div>
      </div>
    `;
  },
  pickDate(v) { Donelist.viewDate = v; Nav.refresh(); },
  shift(n) {
    const d = new Date(Donelist.viewDate || todayStr());
    d.setDate(d.getDate() + n);
    Donelist.viewDate = d.toISOString().slice(0, 10);
    Nav.refresh();
  },
  add(type) {
    if (type === 'later') {
      openModal(`<h3>添加不急事项</h3>
        <span class="label">事项</span><input class="input" id="blText" placeholder="不急但要完成的事">
        <span class="label">备注</span><input class="input" id="blNote" placeholder="截止时间、背景等">
        <button class="btn" onclick="Donelist.saveLater()">保存</button>`);
    } else {
      openModal(`<h3>添加每日待办</h3>
        <span class="label">日期</span>
        <input type="date" class="input" id="taskDate" value="${Donelist.viewDate || todayStr()}">
        <span class="label">任务内容（一行一个，可批量添加）</span>
        <textarea class="textarea" id="taskInput" placeholder="要做什么？" autofocus></textarea>
        <button class="btn" onclick="Donelist.save()">保存</button>`);
    }
  },
  save() {
    const text = $('#taskInput').value.trim();
    if (!text) return toast('请输入内容');
    const date = $('#taskDate').value || todayStr();
    const todos = DB.get('donelist', []);
    text.split('\n').filter(Boolean).forEach(line => {
      todos.push({ id: uid(), text: line.trim(), date, done: false, createdAt: Date.now() });
    });
    DB.set('donelist', todos);
    closeModal(); Nav.refresh(); toast('已添加');
  },
  saveLater() {
    const text = $('#blText').value.trim();
    if (!text) return toast('请输入内容');
    const items = DB.get('backlog', []);
    items.push({ id: uid(), text, note: $('#blNote').value.trim(), done: false, createdAt: Date.now() });
    DB.set('backlog', items);
    closeModal(); Nav.refresh(); toast('已加入不急事项');
  },
  toggle(id) {
    const todos = DB.get('donelist', []);
    const t = todos.find(x => x.id === id);
    if (t) { t.done = !t.done; DB.set('donelist', todos); if (t.done) PetCat.cheer('待办完成啦！🎉'); Nav.refresh(); }
  },
  del(id) {
    if (!confirm('确认删除这条任务？')) return;
    DB.set('donelist', DB.get('donelist', []).filter(t => t.id !== id));
    Nav.refresh(); toast('已删除');
  },
  edit(id) {
    const todos = DB.get('donelist', []);
    const t = todos.find(x => x.id === id);
    if (!t) return;
    openModal(`<h3>编辑任务</h3>
      <span class="label">日期</span>
      <input type="date" class="input" id="editDate" value="${t.date}">
      <span class="label">任务内容</span>
      <textarea class="textarea" id="editText">${esc(t.text)}</textarea>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin:8px 0">
        <input type="checkbox" id="editDone" ${t.done ? 'checked' : ''}> 标记为已完成
      </label>
      <button class="btn" onclick="Donelist.saveEdit('${id}')">保存修改</button>
      <button class="btn secondary" onclick="Donelist.del('${id}');closeModal()" style="margin-top:8px">删除此任务</button>`);
  },
  saveEdit(id) {
    const todos = DB.get('donelist', []);
    const t = todos.find(x => x.id === id);
    if (!t) return;
    const text = $('#editText').value.trim();
    if (!text) return toast('请输入内容');
    t.text = text;
    t.date = $('#editDate').value || t.date;
    t.done = $('#editDone').checked;
    DB.set('donelist', todos);
    closeModal(); Nav.refresh(); toast('已保存修改');
  }
};

/* ============================================
   DAILY READ — 每日必读（时政+申论）
   ============================================ */
const DailyRead = {
  _tab: 'politics',
  _viewDate: null,
  _cache: {},
  _fetchedAt: {},
  render() {
    const date = DailyRead._viewDate || todayStr();
    const isToday = date === todayStr();
    const cached = DailyRead._cache[date];
    if (cached) return DailyRead._renderContent(date, cached);
    DailyRead._load(date);
    return DailyRead._renderLoading(date, isToday);
  },
  _renderLoading(date, isToday) {
    return `<div class="card"><div class="calendar-header">
        <button onclick="DailyRead.shift(-1)">${ICONS.chevL}</button>
        <div class="month">${isToday ? '今日必读' : fmtDate(date)}</div>
        <button onclick="DailyRead.shift(1)">${ICONS.chevR}</button>
      </div>${!isToday ? `<div style="text-align:center;margin-bottom:8px"><button class="btn small ghost" onclick="DailyRead._viewDate='${todayStr()}';Nav.refresh()">回到今天</button></div>` : ''}</div>
      <div class="card"><div style="text-align:center;padding:20px;color:var(--text-2)"><div class="emoji">👋</div>正在加载今日内容...</div></div>`;
  },
  _renderContent(date, data) {
    const isToday = date === todayStr();
    const fa = DailyRead._fetchedAt[date];
    const t = fa ? new Date(fa) : null;
    const timeStr = t ? `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}` : '';
    const srcLabel = data._remote ? '远程' : '本地';
    return `
      <div class="card">
        <div class="calendar-header">
          <button onclick="DailyRead.shift(-1)">${ICONS.chevL}</button>
          <div class="month">${isToday ? '今日必读' : fmtDate(date)}</div>
          <button onclick="DailyRead.shift(1)">${ICONS.chevR}</button>
        </div>
        ${!isToday ? `<div style="text-align:center;margin-bottom:8px"><button class="btn small ghost" onclick="DailyRead._viewDate='${todayStr()}';Nav.refresh()">回到今天</button></div>` : ''}
        <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
          <button class="refresh-btn" onclick="DailyRead.refresh('${date}')">${ICONS.refresh} 刷新</button>
        </div>
        ${fa ? `<div style="font-size:11px;color:var(--text-3);text-align:right;margin-bottom:8px">更新于 ${timeStr} · ${srcLabel}</div>` : ''}
      </div>
      <div class="card">
        <div class="segmented" id="readTab">
          <button class="${DailyRead._tab === 'politics' ? 'active' : ''}" onclick="DailyRead.setTab('politics')">📱 时政(${(data.politics||[]).length})</button>
          <button class="${DailyRead._tab === 'essay' ? 'active' : ''}" onclick="DailyRead.setTab('essay')">✍️ 申论</button>
          <button class="${DailyRead._tab === 'words' ? 'active' : ''}" onclick="DailyRead.setTab('words')">💎 好词好句</button>
          <button class="${DailyRead._tab === 'quiz' ? 'active' : ''}" onclick="DailyRead.setTab('quiz')">🧠 常识</button>
        </div>
        ${DailyRead._tab === 'politics' ? DailyRead._renderPolitics(data.politics||[]) : DailyRead._tab === 'essay' ? DailyRead._renderEssay(data.essay||{}) : DailyRead._tab === 'words' ? DailyRead._renderWords(date) : DailyRead._renderQuiz(date)}
      </div>
    `;
  },
  _renderPolitics(items) {
    if (!items.length) return `<div class="empty"><div class="emoji">📰</div><div>暂无时政内容</div></div>`;
    return items.map((item) => `
      <div class="read-item" style="padding:16px 0">
        <div class="read-body" style="font-size:15px;line-height:1.85;color:var(--text)">${DailyRead._renderBoldText(item.body || item.title || '')}</div>
      </div>`).join('') + `
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn secondary small" onclick="DailyRead.refresh('${DailyRead._viewDate || todayStr()}')">${ICONS.refresh} 重新抓取最新</button>
      </div>`;
  },
  _renderBoldText(text) {
    if (!text) return '';
    return text.replace(/\*\*(.+?)\*\*/g, '<u style="text-decoration:underline;text-decoration-color:var(--primary);text-underline-offset:3px;text-decoration-thickness:2px;font-weight:600">$1</u>');
  },
  _renderEssay(essay) {
    if (!essay || !essay.topic) return `<div class="empty"><div class="emoji">✍️</div><div>暂无申论内容</div></div>`;
    return `
      <div class="essay-box">
        <div class="topic-label">📚 今日话题</div>
        <div class="topic">${esc(essay.topic)}</div>
      </div>
      ${essay.source || essay.background ? `<div class="card" style="margin-top:8px">
        <div class="card-title"><span>📡 出处 / 背景</span></div>
        ${essay.source ? `<div style="font-size:13px;color:var(--primary-dark);font-weight:600;margin-bottom:8px;line-height:1.7">${esc(essay.source)}</div>` : ''}
        ${essay.background ? `<div style="font-size:13px;line-height:1.8;color:var(--text)">${esc(essay.background)}</div>` : ''}
      </div>` : ''}
      ${essay.core_quote ? `<div class="card" style="margin-top:8px">
        <div class="card-title"><span>📖 核心表述 / 原话</span></div>
        <div style="font-size:14px;line-height:1.9;color:var(--primary-dark);font-style:italic;padding:8px 12px;background:var(--primary-soft);border-radius:10px;border-left:3px solid var(--primary)">${esc(essay.core_quote)}</div>
      </div>` : ''}
      ${essay.significance ? `<div class="card" style="margin-top:8px">
        <div class="card-title"><span>🌟 政策意义</span></div>
        <div style="font-size:13px;line-height:1.8">${esc(essay.significance)}</div>
      </div>` : ''}
      ${(essay.measures || []).length ? `<div class="card" style="margin-top:8px">
        <div class="card-title"><span>📌 对策措施 / 规范表述</span></div>
        <div style="font-size:13px;line-height:2">${(essay.measures || []).map((m, i) => `<div>${i+1}. ${esc(m)}</div>`).join('')}</div>
      </div>` : ''}
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn secondary small" onclick="DailyRead.refresh('${DailyRead._viewDate || todayStr()}')">${ICONS.refresh} 重新抓取</button>
      </div>
    `;
  },
  _renderQuiz(date) {
    if (typeof COMMON_SENSE === 'undefined' || !COMMON_SENSE.length) return `<div class="empty"><div class="emoji">🧠</div><div>题库加载中</div></div>`;
    const seed = date.split('-').reduce((a, b) => a + parseInt(b), 0);
    const picks = [];
    const pool = COMMON_SENSE.slice();
    let idx = seed;
    while (picks.length < 3 && pool.length) {
      idx = (idx * 9301 + 49297) % 233280;
      const i = idx % pool.length;
      picks.push(pool.splice(i, 1)[0]);
    }
    return `<div style="font-size:12px;color:var(--text-2);margin-bottom:10px">每日3题 · 今日(${fmtDate(date)})</div>` + picks.map((q, i) => `
      <div class="read-item" id="quiz-${i}" style="padding:14px 0">
        <div class="read-title" style="margin-bottom:8px">${i+1}. ${esc(q.q)}</div>
        <div class="options">
          ${q.opts.map((o, j) => `<div class="opt" onclick="DailyRead.answerQuiz(${i},${j})">${String.fromCharCode(65+j)}. ${esc(o)}</div>`).join('')}
        </div>
        <div class="answer-reveal" id="ans-${i}" style="display:none;font-size:12px;color:var(--success);margin-top:8px;line-height:1.7">✅ 正确答案：${String.fromCharCode(65+q.answer)}. ${esc(q.opts[q.answer])}<br>💡 ${esc(q.tip)}</div>
      </div>`).join('');
  },
  answerQuiz(qi, oi) {
    if (typeof COMMON_SENSE === 'undefined') return;
    const date = DailyRead._viewDate || todayStr();
    const seed = date.split('-').reduce((a, b) => a + parseInt(b), 0);
    const picks = [];
    const pool = COMMON_SENSE.slice();
    let idx = seed;
    while (picks.length < 3 && pool.length) { idx = (idx * 9301 + 49297) % 233280; const i = idx % pool.length; picks.push(pool.splice(i, 1)[0]); }
    const q = picks[qi];
    if (!q) return;
    const opts = $$(`#quiz-${qi} .opt`);
    opts.forEach(o => o.classList.remove('correct', 'wrong'));
    opts[oi].classList.add(oi === q.answer ? 'correct' : 'wrong');
    if (oi !== q.answer) opts[q.answer].classList.add('correct');
    $(`#ans-${qi}`).style.display = 'block';
    if (oi === q.answer) PetCat.cheer('答对了！🎉');
  },
  _renderWords(date) {
    const dayIdx = Math.abs([...date].reduce((a, c) => a + c.charCodeAt(0), 0)) % GOODWORDS_DEFAULT.length;
    const daily = GOODWORDS_DEFAULT[dayIdx];
    const userWords = DB.get('goodwords', []);
    const userHtml = userWords.length ? userWords.slice().reverse().map(w => `
      <div class="essay-box" style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div style="font-weight:700;color:var(--primary-dark);font-size:15px">${esc(w.title)}</div>
          <div style="display:flex;gap:4px">
            <button class="btn-sm" onclick="DailyRead.editWord('${w.id}')" style="font-size:11px;padding:2px 8px">✏️ 编辑</button>
            <button class="task-delete" onclick="DailyRead.delWord('${w.id}')">${ICONS.trash}</button>
          </div>
        </div>
        <div style="font-size:13px;line-height:1.9;white-space:pre-wrap;margin-top:6px">${esc(w.content)}</div>
        <div style="font-size:11px;color:var(--text-3);margin-top:6px">${w.date}</div>
      </div>`).join('') : `<div class="empty" style="padding:16px"><div class="emoji">💎</div><div>还没有积累的好词好句，下面添加一条吧</div></div>`;
    return `
      <div class="essay-box" style="margin-bottom:12px">
        <div class="topic-label">📅 今日推送（${fmtDate(date)}）</div>
        <div class="topic">${esc(daily.title)}</div>
        <div style="font-size:13px;line-height:1.9;white-space:pre-wrap;margin-top:8px">${esc(daily.content)}</div>
      </div>
      <div class="card-title" style="margin-bottom:10px"><span>✏️ 我的积累（${userWords.length}）</span><a onclick="DailyRead.addWord()">+ 添加</a></div>
      ${userHtml}
    `;
  },
  addWord() {
    openModal(`<h3>添加好词好句</h3>
      <span class="label">话题标题</span><input class="input" id="gwTitle" placeholder="如：民生为本">
      <span class="label">内容（名言 + 解读，可多行）</span><textarea class="textarea" id="gwContent" placeholder="名言原文\n解读：适用主题..."></textarea>
      <button class="btn" onclick="DailyRead.saveWord()">保存</button>`);
  },
  saveWord() {
    const title = $('#gwTitle').value.trim();
    const content = $('#gwContent').value.trim();
    if (!title || !content) return toast('请填写标题和内容');
    const words = DB.get('goodwords', []);
    words.push({ id: uid(), title, content, date: todayStr() });
    DB.set('goodwords', words);
    closeModal(); DailyRead.setTab('words'); Nav.refresh(); toast('已积累');
  },
  delWord(id) {
    if (!confirm('删除这条积累？')) return;
    DB.set('goodwords', DB.get('goodwords', []).filter(w => w.id !== id));
    Nav.refresh(); toast('已删除');
  },
  editWord(id) {
    const words = DB.get('goodwords', []);
    const w = words.find(x => x.id === id);
    if (!w) return toast('未找到该条目');
    openModal(`<h3>✏️ 编辑好词好句</h3>
      <span class="label">话题标题</span><input class="input" id="gwTitle" value="${esc(w.title)}" placeholder="如：民生为本">
      <span class="label">内容（名言 + 解读，可多行）</span><textarea class="textarea" id="gwContent" placeholder="名言原文\n解读：适用主题...">${esc(w.content)}</textarea>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="btn" style="flex:1" onclick="DailyRead.updateWord('${id}')">保存修改</button>
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">取消</button>
      </div>`);
  },
  updateWord(id) {
    const title = $('#gwTitle').value.trim();
    const content = $('#gwContent').value.trim();
    if (!title || !content) return toast('请填写标题和内容');
    const words = DB.get('goodwords', []);
    const idx = words.findIndex(w => w.id === id);
    if (idx === -1) return toast('未找到该条目');
    words[idx] = { ...words[idx], title, content, date: todayStr() };
    DB.set('goodwords', words);
    closeModal(); DailyRead.setTab('words'); Nav.refresh(); toast('已更新');
  },
  setTab(t) { DailyRead._tab = t; Nav.refresh(); },
  shift(n) {
    const d = new Date(DailyRead._viewDate || todayStr());
    d.setDate(d.getDate() + n);
    DailyRead._viewDate = d.toISOString().slice(0, 10);
    Nav.refresh();
  },
  answer(qi, oi) {
    const date = DailyRead._viewDate || todayStr();
    const data = DailyRead._cache[date];
    if (!data || !data.politics || !data.politics[qi] || !data.politics[qi].quiz) return;
    const correct = data.politics[qi].quiz.answer;
    const opts = $$(`#quiz-${qi} .opt`);
    opts.forEach((o) => { o.classList.remove('correct', 'wrong'); });
    opts[oi].classList.add(oi === correct ? 'correct' : 'wrong');
    if (oi !== correct) opts[correct].classList.add('correct');
    $(`#ans-${qi}`).style.display = 'block';
  },
  async _load(date) {
    // 默认同源相对路径：部署到 GitHub Pages / 任意静态托管后，自动从同站 news/ 拉取每日更新；
    // 也可在「设置-新闻源地址」填写绝对地址（如 raw.githubusercontent.com）覆盖。
    let newsUrl = (DB.get('newsUrl', '') || '').trim().replace(/\/$/, '');
    if (!newsUrl) {
      const base = (location.pathname || '/').replace(/index\.html$/, '').replace(/\/$/, '');
      newsUrl = base + '/news';
    }
    // 远程优先（GitHub Actions 每天9点生成 daily-YYYY-MM-DD.json）
    try {
      const resp = await fetch(`${newsUrl}/daily-${date}.json?t=${Date.now()}`, { cache: 'no-store' });
      if (resp.ok) {
        const json = await resp.json();
        if (json && json.politics) {
          json._remote = true;
          DailyRead._cache[date] = json;
          DailyRead._fetchedAt[date] = Date.now();
          Nav.refresh();
          return;
        }
      }
    } catch (e) { console.warn('remote news load failed', e); }
    // 本地内置兜底（真实新闻，不依赖后端）
    if (typeof generateBuiltinDaily === 'function') {
      try {
        const data = generateBuiltinDaily(date);
        DailyRead._cache[date] = data;
        DailyRead._fetchedAt[date] = Date.now();
        Nav.refresh();
        return;
      } catch (e) { console.error('builtin daily failed', e); }
    }
  },
  async refresh(date) {
    toast('正在刷新...');
    DailyRead._cache[date] = null;
    await DailyRead._load(date);
    toast('已更新为最新内容');
  }
};

const Study = {
  // 海南大学 自考法学本科（030101K）：免考 2/3/4 后剩余 14 科（不含毕业论文）
  // 本期报考（10月）：合同法 / 犯罪学 / 侵权责任法
  DEFAULT_SUBJECTS: [
    { name: '习近平新时代中国特色社会主义思想概论', isActive: false, examDate: '' },
    { name: '国际法', isActive: false, examDate: '' },
    { name: '国际经济法', isActive: false, examDate: '' },
    { name: '合同法', isActive: true, examDate: '2026-10-24' },
    { name: '公司法', isActive: false, examDate: '' },
    { name: '侵权责任法', isActive: true, examDate: '2026-10-24' },
    { name: '犯罪学', isActive: true, examDate: '2026-10-24' },
    { name: '保险法', isActive: false, examDate: '' },
    { name: '环境资源法学', isActive: false, examDate: '' },
    { name: '商法', isActive: false, examDate: '' },
    { name: '劳动和社会保障法', isActive: false, examDate: '' },
    { name: '国际私法', isActive: false, examDate: '' },
    { name: '知识产权法', isActive: false, examDate: '' },
    { name: '物权法', isActive: false, examDate: '' },
  ],
  // 合并迁移：保留已有科目的日志/进度，补齐缺失默认科目；保留用户自定义科目
  ensureSubjects() {
    const stored = DB.get('subjects', null);
    const defaults = Study.DEFAULT_SUBJECTS;
    if (!stored || !stored.length) {
      const fresh = defaults.map((d, i) => ({
        id: uid(), name: d.name, order: i, isActive: !!d.isActive, examDate: d.examDate || '', targetHours: 0, progress: 0, logs: [], createdAt: Date.now(),
      }));
      DB.set('subjects', fresh);
      return fresh;
    }
    const byName = {};
    stored.forEach(s => { byName[s.name] = s; });
    const merged = defaults.map((d, i) => {
      const ex = byName[d.name];
      if (ex) {
        ex.isActive = !!d.isActive;
        if (ex.examDate === undefined) ex.examDate = '';
        if (ex.logs === undefined) ex.logs = [];
        return ex;
      }
      return { id: uid(), name: d.name, order: i, isActive: !!d.isActive, examDate: d.examDate || '', targetHours: 0, progress: 0, logs: [], createdAt: Date.now() };
    });
    // 保留用户自定义的、不在默认清单里的科目
    stored.forEach(s => {
      if (!defaults.some(d => d.name === s.name)) {
        s.isActive = s.isActive || false;
        if (s.logs === undefined) s.logs = [];
        merged.push(s);
      }
    });
    DB.set('subjects', merged);
    return merged;
  },
  /* ===== 科目独立计时器（替代原番茄钟） =====
     特点：开始计时后用真实时间戳记录，tick 仅用于显示。
     暂停时记录累计秒数；只有"停止"才把学时写入「记录本次学习」。
     锁屏/切屏不影响：基于 Date.now() 差值计算，重新打开页面/回到前台自动补偿。 */
  _timer: { id: null, running: false, sec: 0, startedAt: 0 },
  initTimer() {
    const st = DB.get('studyTimer', null);
    if (st && st.running) {
      // 恢复正在计时的状态（不重启 interval，仅恢复累计秒数，等待页面显示时再 tick）
      Study._timer = { id: st.id, running: true, sec: st.sec, startedAt: Date.now() };
    } else if (st) {
      Study._timer = { id: st.id, running: false, sec: st.sec, startedAt: 0 };
    }
  },
  timerSubjectName() {
    const st = DB.get('studyTimer', null);
    if (!st) return null;
    const s = Study.ensureSubjects().find(x => x.id === st.id);
    return s ? s.name : null;
  },
  fmtTimer(sec) {
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h > 0 ? `${h}:${String(m).padStart(2,'0')}:` : `${String(m).padStart(2,'0')}:`) + String(s).padStart(2,'0');
  },
  startTimer(id) {
    const st = DB.get('studyTimer', null);
    if (st && st.id === id && st.running) return; // 已在计时的就是本科目
    if (st && st.running && st.id !== id) {
      // 切换到另一科目：先停止原科目（消耗的时间丢弃/不记录？这里按"未停止不记录"，直接清空）
      toast('已切换到新科目，原计时未保存（请先点停止保存）');
    }
    const t = { id, running: true, sec: (st && st.id === id ? st.sec : 0), startedAt: Date.now() };
    DB.set('studyTimer', t);
    Study._timer = { id, running: true, sec: t.sec, startedAt: t.startedAt };
    Study._tickTimer();
    if (Study._timerUiId === id) Study._renderTimerCard();
    Nav.refresh();
  },
  pauseTimer() {
    const st = DB.get('studyTimer', null);
    if (!st || !st.running) return;
    const cur = st.sec + Math.floor((Date.now() - st.startedAt) / 1000);
    st.sec = cur; st.running = false; st.startedAt = 0;
    DB.set('studyTimer', st);
    Study._timer = { id: st.id, running: false, sec: cur, startedAt: 0 };
    if (Study._timerUiId === st.id) Study._renderTimerCard();
    Nav.refresh();
  },
  stopTimer(id) {
    const st = DB.get('studyTimer', null);
    if (!st || st.id !== id) return;
    const cur = st.sec + Math.floor((Date.now() - st.startedAt) / 1000);
    DB.remove('studyTimer');
    Study._timer = { id: null, running: false, sec: 0, startedAt: 0 };
    const hours = cur / 3600;
    // 自动写入「记录本次学习」
    const subs = Study.ensureSubjects();
    const s = subs.find(x => x.id === id);
    if (s) {
      const date = todayStr();
      const log = {
        id: uid(), content: '计时学习', hours: Math.round(hours * 100) / 100,
        progress: s.progress || 0, difficulty: '', reviewed: false, date, ts: Date.now(),
      };
      s.logs = s.logs || [];
      s.logs.push(log);
      DB.set('subjects', subs);
    }
    PetCat.cheer(`「${s ? s.name : '科目'}」已学习 ${Study.fmtTimer(cur)}，已记录~ 🐾`);
    if (Study._timerUiId === id) Study._renderTimerCard();
    Nav.refresh();
  },
  _tickTimer() {
    clearInterval(Study._iv);
    Study._iv = setInterval(() => {
      const st = DB.get('studyTimer', null);
      if (!st || !st.running) { clearInterval(Study._iv); return; }
      const total = st.sec + Math.floor((Date.now() - st.startedAt) / 1000);
      // 更新卡片显示
      const disp = document.getElementById('timerDisplay');
      if (disp) disp.textContent = Study.fmtTimer(total);
      // 同步内存状态
      Study._timer.sec = total;
    }, 1000);
  },
  _timerUiId: null,
  _renderTimerCard() {
    const id = Study._timerUiId;
    if (!id) return;
    const el = document.getElementById('timerCard');
    if (!el) return;
    const st = DB.get('studyTimer', null);
    const running = st && st.running && st.id === id;
    const sec = running ? (st.sec + Math.floor((Date.now() - st.startedAt) / 1000)) : (st ? st.sec : 0);
    el.innerHTML = `
      <div style="text-align:center">
        <div id="timerDisplay" style="font-size:48px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;letter-spacing:-1px">${Study.fmtTimer(sec)}</div>
        <div style="font-size:12px;color:var(--text-3);margin:4px 0 12px">${running ? '计时中 · 锁屏/切屏不影响' : '已暂停（点开始继续）'}</div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          ${running
            ? `<button class="btn secondary" onclick="Study.pauseTimer()">⏸ 暂停</button>`
            : `<button class="btn" onclick="Study.startTimer('${id}')">▶ 开始计时</button>`}
          <button class="btn" onclick="Study.stopTimer('${id}')">⏹ 停止并记录</button>
          <button class="btn secondary" onclick="Study.closeTimer()">✕ 收起</button>
        </div>
        <div style="font-size:11px;color:var(--text-3);margin-top:8px">停止后自动写入「记录本次学习」，累加该科累计学时/次数</div>
      </div>`;
  },
  closeTimer() {
    Study._timerUiId = null;
    const el = document.getElementById('timerCard');
    if (el) el.style.display = 'none';
  },
  openTimer(id) {
    Study._timerUiId = id;
    const el = document.getElementById('timerCard');
    if (el) { el.style.display = 'block'; Study._renderTimerCard(); }
  },
  // 连续学习天数（按学习记录日期计算）
  streak(subs) {
    const days = new Set();
    subs.forEach(s => (s.logs || []).forEach(l => { if (l.date) days.add(l.date); }));
    if (!days.size) return 0;
    const iso = dt => { const y = dt.getFullYear(); const m = String(dt.getMonth() + 1).padStart(2, '0'); const d = String(dt.getDate()).padStart(2, '0'); return `${y}-${m}-${d}`; };
    let dt = new Date();
    if (!days.has(iso(dt))) dt.setDate(dt.getDate() - 1); // 今天还没学但昨天有，从昨天起算
    let n = 0;
    while (days.has(iso(dt))) { n++; dt.setDate(dt.getDate() - 1); }
    return n;
  },
  render() {
    const subs = Study.ensureSubjects();
    Study._off = 0;
    Study._cur = studyDailyContent(todayStr(), 0);
    // 若计时器面板处于打开状态，渲染其内容与标题
    if (Study._timerUiId) {
      const tt = subs.find(x => x.id === Study._timerUiId);
      const tc = document.getElementById('timerCard');
      if (!tt && tc) tc.style.display = 'none';
      else if (tt) {
        const tct = document.getElementById('timerCardTitle');
        if (tct) tct.textContent = '⏱ 计时 · ' + tt.name;
        Study._renderTimerCard();
      }
    }
    const allLogs = subs.flatMap(s => s.logs || []);
    const totalHours = allLogs.reduce((s, l) => s + (l.hours || 0), 0);
    const totalSessions = allLogs.length;
    const avgProgress = subs.length ? Math.round(subs.reduce((s, x) => s + (x.progress || 0), 0) / subs.length) : 0;
    const streak = Study.streak(subs);
    const active = subs.filter(s => s.isActive);
    const nearest = active.filter(s => s.examDate).map(s => ({ s, days: Math.ceil((new Date(s.examDate) - new Date(new Date().toDateString())) / 86400000) })).filter(x => x.days >= 0).sort((a, b) => a.days - b.days)[0];
    const bmCount = DB.get('studyBookmarks', []).length;
    const diffCount = subs.reduce((n, s) => n + (s.logs || []).filter(l => l.difficulty && l.difficulty.trim()).length, 0);
    const reviewedCount = allLogs.filter(l => l.reviewed).length;

    const activeCard = active.length ? `<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${active.map(s => `<span class="badge fire">🔥 本期 · ${esc(s.name)}</span>`).join('')}</div>${nearest ? `<div style="margin-top:8px;font-size:13px;color:var(--warning);font-weight:700">⏰ 最近考试：${esc(nearest.s.name)} 还有 ${nearest.days} 天（${fmtDate(nearest.s.examDate)}）</div>` : ''}` : '';

    const statCard = `
      <div class="card">
        <div class="card-title"><span>备考总览 · ${subs.length} 科</span></div>
        <div class="stat-row">
          <div class="stat-box"><div class="num">${totalHours}</div><div class="lbl">累计学时</div></div>
          <div class="stat-box"><div class="num">${totalSessions}</div><div class="lbl">学习次数</div></div>
          <div class="stat-box"><div class="num">${avgProgress}%</div><div class="lbl">平均进度</div></div>
          <div class="stat-box"><div class="num">${streak}</div><div class="lbl">连续学习(天)</div></div>
        </div>
        ${activeCard}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn secondary" onclick="Study.openFlashcard()">🃏 随机抽背</button>
          <button class="btn secondary" onclick="Study.renderBookmarks()">📕 错题本(${bmCount})</button>
          <button class="btn secondary" onclick="Study.renderKeyDiff()">📌 重点难点(${diffCount})</button>
        </div>
        ${reviewedCount ? `<div style="margin-top:8px;font-size:12px;color:var(--text-2)">已标记复习 ${reviewedCount} 条记录</div>` : ''}
      </div>`;

    const list = subs.map(s => {
      const hours = (s.logs || []).reduce((sum, l) => sum + (l.hours || 0), 0);
      const sessions = (s.logs || []).length;
      const pct = clamp(s.progress || 0, 0, 100);
      let daysLeft = null;
      if (s.examDate) daysLeft = Math.ceil((new Date(s.examDate) - new Date(new Date().toDateString())) / 86400000);
      const lastLog = (s.logs || []).slice().sort((a, b) => b.ts - a.ts)[0];
      return `<div class="card" onclick="Study.open('${s.id}')">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:15px;font-weight:700">${esc(s.name)} ${s.isActive ? '<span class="badge fire" style="font-size:10px">本期</span>' : ''}</div>
            <div class="sub" style="font-size:11px;color:var(--text-2);margin-top:3px">
              ${sessions} 次 · ${hours}h ${lastLog ? ' · 最近 ' + fmtDate(lastLog.date) : ' · 还没开始'}
            </div>
          </div>
          ${daysLeft !== null ? `<span class="badge ${daysLeft < 0 ? 'gray' : daysLeft < 14 ? 'orange' : 'blue'}">${daysLeft < 0 ? '已考' : '剩' + daysLeft + '天'}</span>` : ''}
        </div>
        <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2)">
          <span>${s.examDate ? '考试 ' + fmtDate(s.examDate) : '未设考试日'}</span><span>${pct}%</span>
        </div>
        <button class="btn secondary" style="width:100%;margin-top:8px;font-size:13px" onclick="Study.openTimer('${s.id}')">⏱ 计时学习</button>
      </div>`;
    }).join('');

    return statCard
      + `<div id="studyDaily">${Study.renderDaily(0)}</div>`
      + `<div class="card" id="timerCard" style="display:${Study._timerUiId ? 'block' : 'none'};border-left:4px solid var(--primary)"><div class="card-title"><span id="timerCardTitle">⏱ 科目计时器</span></div><div id="timerInner"></div></div>`
      + list
      + `
      <button class="btn secondary" onclick="Study.addSubject()" style="margin-top:8px">+ 添加自定义科目</button>
      <div style="font-size:11px;color:var(--text-3);text-align:center;margin-top:12px;padding:0 16px;line-height:1.6">
        已内置 14 科（免考 3 科后）。每日一练按日期自动轮换；本期重点：合同法 / 犯罪学 / 侵权责任法。
      </div>`;
  },
  renderDaily(offset) {
    const c = studyDailyContent(todayStr(), offset);
    const m = c.question;
    const optsHtml = m ? m.opts.map((o, i) => `<div class="opt">${String.fromCharCode(65 + i)}. ${esc(o)}</div>`).join('') : '';
    const ansHtml = m ? `<div class="daily-answer" id="dailyAns" style="display:none;margin-top:8px;padding:10px 12px;background:#f5f9f5;border-radius:8px;font-size:13px;white-space:pre-wrap">正确答案：${String.fromCharCode(65 + m.answer)}\n${esc(m.tip)}</div>` : '';
    return `
      <div class="card daily-card">
        <div class="card-title"><span>📅 每日一练 · ${esc(c.subject)}</span><span class="badge blue">${fmtDate(todayStr())}</span></div>
        ${m ? `<div style="font-weight:700;margin-bottom:8px">${esc(m.q)}</div>${optsHtml}${ansHtml}
          <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
            <button class="btn secondary" onclick="Study.toggleAnswer()">显示答案/解析</button>
            <button class="btn secondary" onclick="Study.moreDaily()">换一题</button>
            <button class="btn secondary" onclick="Study.bookmark()">★ 收藏</button>
          </div>` : `<div class="empty"><div class="emoji">📖</div><div>今日暂无推送</div></div>`}
        <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
          <div style="font-size:12px;color:var(--text-2);margin-bottom:4px">💡 考点速记</div>
          <div style="font-size:13px;line-height:1.6">${esc(c.quick)}</div>
        </div>
        ${c.law ? `<div style="margin-top:10px;font-size:12px;color:var(--text-2);background:#f5f9f5;padding:8px 10px;border-radius:8px;line-height:1.6">📜 ${esc(c.law)}</div>` : ''}
      </div>`;
  },
  toggleAnswer() {
    const el = document.getElementById('dailyAns');
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  },
  moreDaily() {
    Study._off = (Study._off || 0) + 1;
    Study._cur = studyDailyContent(todayStr(), Study._off);
    const el = document.getElementById('studyDaily');
    if (el) el.innerHTML = Study.renderDaily(Study._off);
  },
  bookmark() {
    const c = Study._cur;
    if (!c) return;
    const bm = DB.get('studyBookmarks', []);
    const key = c.question ? c.question.q : c.quick;
    if (bm.some(b => b.q === key)) return toast('已在错题本中');
    bm.unshift({
      id: uid(), subject: c.subject,
      q: c.question ? c.question.q : c.quick,
      a: c.question ? ('正确答案：' + String.fromCharCode(65 + c.question.answer) + '\n' + c.question.tip) : '',
      note: c.quick, addedAt: Date.now(),
    });
    DB.set('studyBookmarks', bm);
    toast('★ 已收藏到错题本');
  },
  renderBookmarks() {
    const bm = DB.get('studyBookmarks', []);
    const html = bm.length ? bm.map(b => `
      <div class="list-item">
        <div class="main">
          <div class="title">${esc(b.q)}</div>
          <div class="sub">${esc(b.subject)}${b.a ? ' · 已收藏' : ''}</div>
          ${b.a ? `<div style="font-size:12px;color:var(--text-2);margin-top:4px;white-space:pre-wrap">${esc(b.a)}</div>` : ''}
        </div>
        <button class="task-delete" onclick="Study.delBookmark('${b.id}')">${ICONS.trash}</button>
      </div>`).join('') : `<div class="empty"><div class="emoji">📕</div><div>错题本还是空的<br>在「每日一练」点 ★ 收藏吧</div></div>`;
    openModal(`<h3>📕 错题本 / 收藏夹（${bm.length}）</h3>${html}<div style="font-size:11px;color:var(--text-3);margin-top:8px">收藏来自每日一练，便于考前集中回看易错点。</div>`);
  },
  delBookmark(id) {
    DB.set('studyBookmarks', DB.get('studyBookmarks', []).filter(b => b.id !== id));
    Study.renderBookmarks();
  },
  renderKeyDiff() {
    const subs = Study.ensureSubjects();
    const items = [];
    subs.forEach(s => (s.logs || []).forEach(l => { if (l.difficulty && l.difficulty.trim()) items.push({ subject: s.name, content: l.content, diff: l.difficulty, date: l.date }); }));
    items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const html = items.length ? items.map(it => `
      <div class="list-item">
        <div class="main">
          <div class="title">${esc(it.diff)}</div>
          <div class="sub">${esc(it.subject)} · ${fmtDate(it.date)}${it.content ? ' · ' + esc(it.content) : ''}</div>
        </div>
      </div>`).join('') : `<div class="empty"><div class="emoji">📌</div><div>还没有记录重点难点<br>在科目详情记学习时写下「重点难点/心得」</div></div>`;
    openModal(`<h3>📌 重点难点本（待复习 ${items.length}）</h3>${html}<div style="font-size:11px;color:var(--text-3);margin-top:8px">汇总所有科目学习记录里的难点与心得，考前集中攻克。</div>`);
  },
  openFlashcard() {
    const cards = studyFlashcards();
    for (let i = cards.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cards[i], cards[j]] = [cards[j], cards[i]]; }
    Study._fc = { cards, i: 0, flipped: false };
    Study._renderFlashcard();
  },
  _renderFlashcard() {
    const fc = Study._fc;
    if (!fc || !fc.cards.length) { openModal('<h3>🃏 随机抽背</h3><div class="empty"><div class="emoji">🃏</div><div>暂无可抽背内容</div></div>'); return; }
    const c = fc.cards[fc.i];
    openModal(`
      <div style="text-align:center">
        <h3 style="text-align:left">🃏 随机抽背 · ${esc(c.subject)}</h3>
        <div class="flashcard ${fc.flipped ? 'flipped' : ''}" onclick="Study.flipFlashcard()">
          <div class="fc-inner">
            <div class="fc-face fc-front">${esc(c.front)}</div>
            <div class="fc-face fc-back" style="white-space:pre-wrap">${esc(c.back)}</div>
          </div>
        </div>
        <div style="font-size:12px;color:var(--text-2);margin:10px 0">${fc.i + 1} / ${fc.cards.length} · 点击卡片翻面</div>
        <div style="display:flex;gap:8px;justify-content:center">
          <button class="btn secondary" onclick="Study.nextFlashcard()">下一张 →</button>
          <button class="btn" onclick="Study.openFlashcard()">🔀 重新洗牌</button>
        </div>
      </div>`);
  },
  flipFlashcard() { Study._fc.flipped = !Study._fc.flipped; Study._renderFlashcard(); },
  nextFlashcard() { Study._fc.i = (Study._fc.i + 1) % Study._fc.cards.length; Study._fc.flipped = false; Study._renderFlashcard(); },
  addSubject() {
    openModal(`<h3>添加自定义科目</h3>
      <span class="label">科目名称</span>
      <input class="input" id="subName" placeholder="如：数据结构">
      <span class="label">考试日期（可选）</span>
      <input type="date" class="input" id="subDate">
      <span class="label">目标学习时长（小时）</span>
      <input type="number" class="input" id="subHours" placeholder="如 50">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);margin:8px 0">
        <input type="checkbox" id="subActive"> 标记为本期报考（重点复习）
      </label>
      <button class="btn" onclick="Study.saveSubject()">保存</button>`);
  },
  saveSubject() {
    const name = $('#subName').value.trim();
    if (!name) return toast('请输入科目名称');
    const active = $('#subActive').checked;
    const subs = Study.ensureSubjects();
    subs.push({ id: uid(), name, order: subs.length, isActive: active, examDate: $('#subDate').value || (active ? '2026-10-24' : ''), targetHours: +$('#subHours').value || 0, progress: 0, logs: [], createdAt: Date.now() });
    DB.set('subjects', subs);
    closeModal(); Nav.refresh(); toast('已添加科目');
  },
  open(id) {
    const s = Study.ensureSubjects().find(x => x.id === id);
    if (!s) return;
    Study.cur = id;
    const hours = (s.logs || []).reduce((sum, l) => sum + (l.hours || 0), 0);
    const pct = clamp(s.progress || 0, 0, 100);
    const daysLeft = s.examDate ? Math.ceil((new Date(s.examDate) - new Date(new Date().toDateString())) / 86400000) : null;
    const logs = (s.logs || []).slice().sort((a, b) => b.ts - a.ts);
    const logHtml = logs.length ? logs.map(l => `
      <div class="list-item">
        <div class="main">
          <div class="title">${esc(l.content)}${l.reviewed ? ' <span class="badge green">已复习</span>' : ''}</div>
          <div class="sub">${fmtDate(l.date)} · ${l.hours}h ${l.difficulty ? ' · 难点：' + esc(l.difficulty) : ''}</div>
        </div>
        <button class="task-delete" onclick="Study.delLog('${id}','${l.id}')">${ICONS.trash}</button>

      <button class="btn secondary" onclick="Study.delSubject('${id}');closeModal()" style="margin-top:16px">删除该科目</button>
    `);
  },
  addLog(id) {
    const s = Study.ensureSubjects().find(x => x.id === id);
    const curProgress = s ? (s.progress || 0) : 0;
    // 若计时器正在/暂停在该科目，把已计秒数换算成小时预填
    let prefillHours = '';

    if (st && st.id === id) {
      const sec = st.sec + (st.running ? Math.floor((Date.now() - st.startedAt) / 1000) : 0);

      <span class="label">日期</span>
      <input type="date" class="input" id="logDate" value="${todayStr()}">
