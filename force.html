<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>正在刷新工作台…</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #f4f8f5; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #5b7a52; }
    .box { text-align: center; padding: 30px; }
    .spin { width: 40px; height: 40px; border: 4px solid #d8e6d2; border-top-color: #7cb342; border-radius: 50%; animation: r 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>正在清除旧缓存并加载最新版本…</div>
  </div>
  <script>
  (async () => {
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch (e) { console.warn('caches', e); }
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
    } catch (e) { console.warn('sw', e); }
    // 用时间戳彻底绕过浏览器 HTTP 缓存
    const t = Date.now();
    location.replace('./index.html?t=' + t + '#fresh');
  })();
  </script>
</body>
</html>
