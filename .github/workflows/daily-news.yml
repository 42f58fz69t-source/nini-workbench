name: 每日时政申论自动更新
on:
  schedule:
    # 每天北京时间9点（UTC 1点）
    - cron: '0 1 * * *'
  workflow_dispatch:  # 也支持手动触发

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 抓取当日时政申论
        run: node fetch-news.js

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          git diff --staged --quiet || git commit -m "📡 自动更新 $(date -u -d '+8 hours' +%Y-%m-%d) 时政申论"
          git push
